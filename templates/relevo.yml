# relevo.yml: one per repository. /relevo:init creates and updates this file.
# Validate it with: node scripts/validate-config.mjs relevo.yml
# Never put API keys or tokens here; they belong in the repository secret store.

branches:
  base: dev            # integration branch: feature pull requests target it
  release: main        # promoted from base in a separate pull request

tracker: github        # github (more later)
git_provider: github   # github (more later)
platforms:                         # what is built and where; one entry per stack (see docs/stacks.md)
  app:
    stack: flutter                 # the profile in stacks/<stack>.md of the plugin, or in .relevo/stacks/
    path: .                        # folder of the repository where this platform lives
    targets: [android]             # flutter: android | ios | web
    # checks:                      # replace a verification command of the profile, for example:
    #   test: fvm flutter test

links: []              # repositories an issue may depend on (Depends-on: owner/repo#N); private ones need the secret RELEVO_LINKS_TOKEN

team:
  members: []          # GitHub usernames of the people who build and review
  spec_writer: null    # writes the specs; never reviews or merges
  approvers: []        # only used when review.mode is "roles"

review:
  mode: peer           # none (solo) | peer | roles
  merger: approver     # author | approver: who runs /relevo:ship
  autopilot: off       # off | precheck | verify: how much of the on-device review the agent may drive (the person always closes it)
  allowed_origins: []  # web origins a driven review may visit besides localhost, e.g. https://staging.example.com
  ship_without_ci: false  # true: the relevo:ship label may merge when no check ran (/relevo:ship asks instead)

limits:
  built_unreviewed_per_person: 2   # built issues one person may have waiting
  concurrent_agents: 3             # unattended runs at the same time
  review_sla_hours: 8              # reminder, then escalation after the same time again
  run_max_turns: 100               # per unattended run
  building_alert_hours: 3          # hours without activity before an issue on `building` is reported as stuck
  run_max_cost: 5                  # REQUIRED: US dollars per unattended run; choose your own

# runner:                            # where the Relevo workflows run; leave it out for GitHub-hosted (ubuntu-latest)
#   labels: [self-hosted, linux-build]     # a self-hosted runner is assumed to persist between jobs (docs/execution.md)

qa:
  retries: 1                       # developer attempts after QA rejects
  rules_from: CLAUDE.md            # project rules QA reads at every run

evidence:
  policy: attach_to_pr             # attach_to_pr | local_only (use for sensitive data)

digest:
  issue: null                     # number of the issue where the daily digest is posted as a comment; subscribe your chat tool to it

design:
  images: false        # true: a picture pasted into an issue is downloaded and shown to the model (it may hold customer data); files in the repository are always available

language: en                       # language of hand-off messages (en, es)
trust: private-team                # private-team | public

# Rename any label here; keys are fixed, names are yours.
# labels:
#   ready: relevo:ready
#   built: relevo:built
