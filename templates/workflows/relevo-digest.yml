# relevo-template: 0.10.0
# Relevo: posts one digest per working day, as a comment on the issue named by digest.issue in relevo.yml.
# It lists who is waiting on what and the alerts, and posts nothing when nothing is waiting.
# Subscribe your chat tool to that issue to receive it. Copy to .github/workflows/relevo-digest.yml.
# Change the time below to suit your team (cron is in UTC).
# The scripts come from the published package @elalfner/relevo, at the version pinned in RELEVO_VERSION.

# Runner: `runs-on` comes from `runner.labels` in relevo.yml (`/relevo:init` writes it into this file, `/relevo:doctor` checks it).
# The runner needs git, gh and jq; Node and the tools of the job are installed per job. A self-hosted runner is assumed to
# persist between jobs, so the job puts its tools under $RUNNER_TEMP and removes what it adds to the workspace.

name: relevo-digest

# The version of @elalfner/relevo whose scripts this workflow runs. The plugin's templates carry the version they
# were released with, and `/relevo:init` reports this file as different when it is older; change it by hand to update.
env:
  RELEVO_VERSION: '0.10.0'

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: relevo-digest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Relevo scripts
        # The published package at the version pinned above; no repository is cloned for them. A package without the
        # script this job runs stops the run here, before anything is changed.
        run: |
          mkdir -p .relevo-plugin
          npm pack "@elalfner/relevo@$RELEVO_VERSION" --silent --pack-destination "$RUNNER_TEMP" > /dev/null
          tar -xzf "$RUNNER_TEMP"/elalfner-relevo-*.tgz --strip-components=1 -C .relevo-plugin
          for f in scripts/digest.mjs; do
            [ -f ".relevo-plugin/$f" ] || { echo "::error::The Relevo package $RELEVO_VERSION lacks $f"; exit 1; }
          done

      - name: Post the digest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .relevo-plugin/scripts/digest.mjs --repo "$GITHUB_REPOSITORY"

      # A runner may keep its workspace between jobs (a self-hosted one does): remove what this job added to it.
      - name: Remove what this job added
        if: always()
        run: rm -rf .relevo-plugin
