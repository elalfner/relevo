# relevo-template: 0.14.5
# Relevo: builds an issue when someone with write access labels it `relevo:ready`.
# Copy to .github/workflows/relevo-go.yml. If you renamed the ready label in relevo.yml, change it below too.
#
# Two jobs. `decide` is light (Node and the plugin's scripts, about half a minute): it runs the gates, claims the
# issue and comments when there is nothing to build. Only when the decision is `start` does `build` install the
# toolchain and run the agent, so an issue that is blocked, queued or incomplete never pays for that setup.
#
# Needs: a model credential secret (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN), and a relevo.yml at the
# repository root.
# Keep the numbers in claude_args in line with limits.run_max_turns and limits.run_max_cost.
# Where the numbers disagree the lower one wins, so this file can only make a run cheaper than relevo.yml says.

# Runner: `runs-on` comes from `runner.labels` in relevo.yml (`/relevo:init` writes it into this file, `/relevo:doctor` checks it).
# The runner needs git, gh and jq; Node and the tools of the job are installed per job. A self-hosted runner is assumed to
# persist between jobs, so the job puts its tools under $RUNNER_TEMP and removes what it adds to the workspace.

name: relevo-go

# The version of @elalfner/relevo whose scripts this workflow runs. The plugin's templates carry the version they
# were released with, and `/relevo:init` reports this file as different when it is older; change it by hand to update.
env:
  RELEVO_VERSION: '0.14.5'
  # The version of OpenSpec that the job installs for itself.
  OPENSPEC_VERSION: '1.14.3'
  # The version of Bun that the build job installs, caches and hands to the agent action. It is the one claude-code-action
  # installs on its own (and downloads again on every run); change it by hand if you pin another version of that action.
  BUN_VERSION: '1.4.4'

on:
  issues:
    types: [labeled]
  # The queue workflow (relevo-queue.yml) starts waiting issues through this trigger.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to build
        required: true

# One run per issue: a repeated label event waits for the first run and then finds the issue already building.
concurrency:
  group: relevo-go-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  decide:
    # The repository variable RELEVO_CLOUD_GO set to `off` pauses the cloud: a ready label starts nothing and the issue
    # stays ready for a local run (/relevo:go <n>). It is read at run time, so changing it needs no pull request.
    if: vars.RELEVO_CLOUD_GO != 'off' && (github.event_name == 'workflow_dispatch' || (github.event.label.name == 'relevo:ready' && github.event.sender.type == 'User'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same permissions as the workflow plus `actions: read`, to read how long the recent builds took for the comment of a queued
    # issue (without it the comment says "unknown"). Read only: `actions: write` is held by the `requeue` job and nowhere else.
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      decision_b64: ${{ steps.plan.outputs.decision_b64 }}
      # The platform the issue is for (empty unless the decision is `start`): the build job installs only its toolchain.
      platform: ${{ steps.plan.outputs.platform }}
      stack: ${{ steps.plan.outputs.stack }}
      path: ${{ steps.plan.outputs.path }}
    steps:
      # The repository holds relevo.yml; the plugin holds the scripts that apply the gates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install the Relevo scripts
        # The published package at the version pinned above; no repository is cloned for them. A package without the
        # script this job runs stops the run here, before anything is changed.
        run: |
          mkdir -p .relevo-plugin
          npm pack "@elalfner/relevo@$RELEVO_VERSION" --silent --pack-destination "$RUNNER_TEMP" > /dev/null
          tar -xzf "$RUNNER_TEMP"/elalfner-relevo-*.tgz --strip-components=1 -C .relevo-plugin
          for f in scripts/go-plan.mjs scripts/render-message.mjs; do
            [ -f ".relevo-plugin/$f" ] || { echo "::error::The Relevo package $RELEVO_VERSION lacks $f"; exit 1; }
          done

      # Applies the gates and, when the decision is `start`, claims the issue (relevo:building). Any other decision
      # (needs-spec, blocked, queued, denied, no milestone, no assignee) is applied here with its comment.
      - name: Gates and claim
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Only needed when `links` in relevo.yml lists a private repository: a read-only token (issues, pull
          # requests and contents) stored as the secret RELEVO_LINKS_TOKEN. Here it reads the issues the dependencies
          # name; the step "Fetch the references of the issue" of the build reads files with it. It is used only to
          # read, never to write, and an empty value is fine (public repositories are read without it).
          GH_LINKS_TOKEN: ${{ secrets.RELEVO_LINKS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          # relevo:credential begin
          # Without a model credential the cloud cannot build: the issue stays ready and a comment says to run it locally.
          HAS_CREDENTIAL: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          # relevo:credential end
        run: node .relevo-plugin/scripts/go-plan.mjs --repo "$GITHUB_REPOSITORY" --only "$ISSUE" --apply --claim --credential "$HAS_CREDENTIAL" --github-output "$GITHUB_OUTPUT"

      # See the same step in `build`. A failure before the issue is claimed (the plugin cannot be cloned, the
      # scripts fail) leaves it ready or queued with nobody told.
      - name: Report a run that ended without an outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          labels=$(gh issue view "$ISSUE" --json labels --jq '.labels[].name')
          if [ "$JOB_STATUS" = "success" ]; then
            exit 0
          fi
          if ! printf '%s\n' "$labels" | grep -qxE 'relevo:(ready|queued|building)'; then
            exit 0
          fi
          assignee=$(gh issue view "$ISSUE" --json assignees --jq '.assignees[0].login // empty')
          gh issue edit "$ISSUE" --remove-label relevo:ready --remove-label relevo:queued --remove-label relevo:building --add-label relevo:qa-failed
          # The words come from the message catalog, in the language of relevo.yml. This step runs because a step before it failed,
          # possibly the one that installs the scripts: then the English sentence below is posted, so the issue is still told.
          body=""
          if [ -f .relevo-plugin/scripts/render-message.mjs ]; then
            body=$(ASSIGNEE="$assignee" node -e 'const e = process.env; console.log(JSON.stringify({assignee: e.ASSIGNEE, issue: e.ISSUE, job_status: e.JOB_STATUS, run: e.RUN_URL}))' \
              | node .relevo-plugin/scripts/render-message.mjs run_failed_early --config relevo.yml) || body=""
          fi
          [ -n "$body" ] || body="${assignee:+@$assignee }The run failed before it could decide what to do (job status: $JOB_STATUS), so nothing was built. Read the log to see why: $RUN_URL. When the cause is fixed, remove \`relevo:qa-failed\` and apply \`relevo:ready\` again."
          gh issue comment "$ISSUE" --body "$body"

      # A runner may keep its workspace between jobs (a self-hosted one does): remove what this job added to it.
      - name: Remove what this job added
        if: always()
        run: rm -rf .relevo-plugin

  build:
    needs: decide
    if: needs.decide.outputs.action == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # The agent runs the project's own checks (QA runs them), so the toolchain of the stack of the platform of the
      # issue is installed here. The `decide` job tells which one (`needs.decide.outputs.stack`) and where it lives
      # (`needs.decide.outputs.path`), so an issue for the front does not install the back's tools: a step whose stack
      # is not the issue's is skipped and costs nothing. The names are the `stack` of relevo.yml. Change the versions
      # and the caching to suit the project; `/relevo:doctor` fails when a Flutter, Laravel or Supabase platform has no
      # active step below, because every build would fail QA after spending the run.
      - if: needs.decide.outputs.stack == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: needs.decide.outputs.stack == 'laravel'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      # Supabase: the CLI runs the checks of the profile against containers on the runner, which already has Docker.
      - if: needs.decide.outputs.stack == 'supabase'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest
      # Vue needs only Node, which this job installed above; to cache the packages, uncomment (this cache is saved when the job
      # ends, after the agent: docs/security.md says what that means):
      #   - if: needs.decide.outputs.stack == 'vue'
      #     uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      #     with:
      #       node-version: 22
      #       cache: npm
      #       cache-dependency-path: ${{ needs.decide.outputs.path }}/package-lock.json
      # Another stack, including one of your own (Go, Python...): add a step guarded by its name, and its dependencies
      # below. `/relevo:doctor` warns when a stack that only your repository defines has no such step.
      # Installing the dependencies is the project's choice, because the package manager and the lockfile vary. Do it
      # from the folder of the platform, for example:
      #   - if: needs.decide.outputs.stack == 'vue'
      #     working-directory: ${{ needs.decide.outputs.path }}
      #     run: npm ci --ignore-scripts
      # Install dependencies without package scripts where the tool offers it, so a dependency cannot run code
      # while it is installed: `npm ci --ignore-scripts`, `pnpm install --frozen-lockfile --ignore-scripts`,
      # `composer install --no-scripts`. `flutter pub get` and `dart pub get` run no install-time scripts of
      # the packages, so they need no such option.
      # The profile of each stack lists the path that exists once the dependencies are installed, and the check of the
      # toolchain stops the build before the agent when it does not exist: add the step of your stack
      # (/relevo:doctor warns when no step installs the dependencies of a platform). For Flutter and Laravel:
      #   - if: needs.decide.outputs.stack == 'flutter'
      #     working-directory: ${{ needs.decide.outputs.path }}
      #     run: flutter pub get
      #   - if: needs.decide.outputs.stack == 'laravel'
      #     working-directory: ${{ needs.decide.outputs.path }}
      #     run: composer install --no-scripts --no-interaction

      # The tools that the build downloads are kept in the cache, under a key that names the pinned version, the operating
      # system and the architecture, so raising a pin installs and caches the new one and restores nothing of the old one. A
      # cache is restored first and saved by its own step right after the install and BEFORE the agent starts: a cache that
      # a post step saved when the job ends would hold whatever the agent (which has Bash) left in those files. Nothing is
      # saved after the agent. If the cache service cannot be reached the tools are installed as before.
      - name: Restore OpenSpec from the cache
        id: openspec_cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openspec
          key: openspec-${{ env.OPENSPEC_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install OpenSpec
        # After a restore npm only checks that the pinned version is there; without one it installs it.
        # Under the temporary folder of the job, at the pinned version: nothing global is left on a runner that persists.
        run: |
          npm install --prefix "$RUNNER_TEMP/openspec" "@fission-ai/openspec@$OPENSPEC_VERSION" --no-fund --no-audit
          echo "$RUNNER_TEMP/openspec/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          OPENSPEC_TELEMETRY: '0'

      - name: Save OpenSpec to the cache
        if: steps.openspec_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openspec
          key: openspec-${{ env.OPENSPEC_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # Bun is what claude-code-action runs on. The action downloads it on every run (it turns its own cache off), so the job
      # installs the pinned version itself and gives the action its path (path_to_bun_executable). The binary that comes out
      # of the cache must report BUN_VERSION or the job stops here, before the agent.
      - name: Restore Bun from the cache
        id: bun_cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun/bun
          key: bun-${{ env.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Bun
        id: bun_install
        if: steps.bun_cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          # The cache of this action would be saved when the job ends, after the agent: it is off, and the step below saves it.
          no-cache: true

      - name: Check the version of Bun
        id: bun
        env:
          BUN_INSTALLED: ${{ steps.bun_install.outputs.bun-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/bun"
          [ -z "$BUN_INSTALLED" ] || cp "$BUN_INSTALLED" "$RUNNER_TEMP/bun/bun"
          chmod +x "$RUNNER_TEMP/bun/bun"
          actual=$("$RUNNER_TEMP/bun/bun" --version)
          [ "$actual" = "$BUN_VERSION" ] || { echo "::error::Bun reports version $actual but the workflow pins $BUN_VERSION"; exit 1; }
          echo "path=$RUNNER_TEMP/bun/bun" >> "$GITHUB_OUTPUT"

      - name: Save Bun to the cache
        if: steps.bun_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun/bun
          key: bun-${{ env.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # Stops before the agent, without spending a model turn, when the runner lacks a tool that the profile of the
      # platform lists (the Flutter SDK, PHP and Composer, ...): otherwise the developer writes the code and QA only
      # finds out at the end, after a full run. The package is unpacked outside the workspace on purpose: the agent needs
      # a clean working tree. The agent loads its plugin from this same folder (--plugin-dir), so a package without
      # .claude-plugin/plugin.json stops the run here too. If you renamed the labels in relevo.yml, change the names below too.
      - name: Check the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          PLATFORM: ${{ needs.decide.outputs.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/relevo"
          npm pack "@elalfner/relevo@$RELEVO_VERSION" --silent --pack-destination "$RUNNER_TEMP" > /dev/null
          tar -xzf "$RUNNER_TEMP"/elalfner-relevo-*.tgz --strip-components=1 -C "$RUNNER_TEMP/relevo"
          for f in scripts/toolchain-check.mjs scripts/render-message.mjs scripts/design-fetch.mjs .claude-plugin/plugin.json; do
            [ -f "$RUNNER_TEMP/relevo/$f" ] || { echo "::error::The Relevo package $RELEVO_VERSION lacks $f"; exit 1; }
          done
          if result=$(node "$RUNNER_TEMP/relevo/scripts/toolchain-check.mjs" --platform "$PLATFORM" --plugin-root "$RUNNER_TEMP/relevo"); then
            exit 0
          fi
          # No jq here: the tool that is missing may be jq itself, and the comment must still be posted.
          missing=$(printf '%s' "$result" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).missing.join(", "))')
          # The paths that the profile says exist once the dependencies are installed (a folder of packages, for example):
          # when the tools are there and one of these is not, the install step of this job did not run or did not finish.
          paths=$(printf '%s' "$result" | node -e 'console.log((JSON.parse(require("fs").readFileSync(0, "utf8")).missing_installed || []).join(", "))')
          [ -n "$missing" ] || [ -n "$paths" ] || { echo "::error::The toolchain check failed: $result"; exit 1; }
          title=$(gh issue view "$ISSUE" --json title --jq .title)
          assignee=$(gh issue view "$ISSUE" --json assignees --jq '.assignees[0].login // empty')
          if [ -n "$missing" ]; then
            body=$(ASSIGNEE="$assignee" TITLE="$title" TOOLS="$missing" node -e 'const e = process.env; console.log(JSON.stringify({assignee: e.ASSIGNEE, issue: e.ISSUE, title: e.TITLE, tools: e.TOOLS, platform: e.PLATFORM}))' \
              | node "$RUNNER_TEMP/relevo/scripts/render-message.mjs" toolchain_missing --config relevo.yml)
            what="The runner has no $missing, so nothing was built"
          else
            body=$(ASSIGNEE="$assignee" TITLE="$title" PATHS="$paths" node -e 'const e = process.env; console.log(JSON.stringify({assignee: e.ASSIGNEE, issue: e.ISSUE, title: e.TITLE, paths: e.PATHS, platform: e.PLATFORM}))' \
              | node "$RUNNER_TEMP/relevo/scripts/render-message.mjs" installed_missing --config relevo.yml)
            what="The dependencies are not installed ($paths is missing), so nothing was built"
          fi
          gh issue edit "$ISSUE" --remove-label relevo:ready --remove-label relevo:queued --remove-label relevo:building --add-label relevo:qa-failed
          gh issue comment "$ISSUE" --body "$body"
          echo "::error::$what"
          exit 1

      # One comment on the issue shows the phase, the tasks and the minutes of the run, and the Relevo scripts of this
      # package edit it every 30 seconds from here, beside the agent, until the job ends. It lives outside the agent
      # block on purpose: it serves any agent. Nothing is written in the workspace (the agent needs a clean tree): the
      # state is under $RUNNER_TEMP, and RELEVO_PROGRESS_DIR tells the go skill where to announce its phase. The step
      # never fails the job, and a package without the script simply shows no progress. --max-minutes is the
      # timeout-minutes of this job plus a margin: the check ends by itself even if this job is cancelled.
      - name: Start the progress report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          DECISION: ${{ needs.decide.outputs.decision_b64 }}
        run: |
          script="$RUNNER_TEMP/relevo/scripts/progress.mjs"
          [ -f "$script" ] || exit 0
          dir="$RUNNER_TEMP/relevo-progress"
          rm -rf "$dir"
          mkdir -p "$dir"
          echo "RELEVO_PROGRESS_DIR=$dir" >> "$GITHUB_ENV"
          RELEVO_PROGRESS_DIR="$dir" nohup node "$script" watch --issue "$ISSUE" --decision "$DECISION" --max-minutes 65 > "$dir/watch.log" 2>&1 &
          exit 0

      # Fetches what the issue points to (its Design reference, and the Code pointers that name a file of a linked
      # repository) before the agent starts, into .relevo-design/, which git ignores. This is the only step of this job
      # that gets RELEVO_LINKS_TOKEN: a read-only token (issues, pull requests and contents) that reads the files of
      # the private repositories in `links`, never writes, and never reaches the agent. An empty value is fine (public
      # repositories are read without it). A refused reference does not fail the step: the manifest lists it and the
      # agent sends the issue back to needs-spec with the reason. Any other failure stops the job here.
      - name: Fetch the references of the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_LINKS_TOKEN: ${{ secrets.RELEVO_LINKS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          code=0
          node "$RUNNER_TEMP/relevo/scripts/design-fetch.mjs" --issue "$ISSUE" --repo "$GITHUB_REPOSITORY" || code=$?
          [ "$code" -le 1 ] || exit "$code"
          echo "RELEVO_REFERENCES=$GITHUB_WORKSPACE/.relevo-design/manifest.json" >> "$GITHUB_ENV"

      # The install step above can rewrite a lockfile (`flutter pub get`, `npm ci`). Record which files already differ from
      # the commit before the agent starts, so that the rescue and the checkpoints do not take them for the agent's work:
      # the safe commit would refuse a dependency file the issue did not list, and the whole commit with it. A file the
      # agent changes afterwards is still judged like any change. It never fails the job.
      - name: Record the state of the working tree before the agent
        continue-on-error: true
        run: |
          script="$RUNNER_TEMP/relevo/scripts/tree-baseline.mjs"
          [ -f "$script" ] && [ -n "$RELEVO_PROGRESS_DIR" ] || exit 0
          node "$script" record || true

      # What the build cannot go on without is checked here, with no model, before the agent starts: a reference that the
      # fetcher refused, and the inputs that the issue declares in its External inputs section. When something is
      # missing the issue goes back to its writer with the reason, the comment names what is missing, and this step ends
      # the job, so the agent steps below do not run and no model turn is spent. It also lists, for the hand-off, the
      # inputs that a person has to confirm. Only the names of the variables of the repository are read, never their
      # values, and a secret counts only when you expose it to this step. An older package without the script skips this
      # step and the agent takes the same path itself. This check only saves cost: the guards stay in force.
      # If you renamed the labels in relevo.yml, change the names below too.
      - name: Check the issue before the agent
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          DECISION: ${{ needs.decide.outputs.decision_b64 }}
          VARIABLES: ${{ toJSON(vars) }}
        run: |
          script="$RUNNER_TEMP/relevo/scripts/build-preflight.mjs"
          [ -f "$script" ] || exit 0
          fields=$(printf '%s' "$DECISION" | base64 -d | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log([d.base || "", d.assignee || "", d.title || "", d.spec_writer || ""].join("\n"))')
          base=$(printf '%s\n' "$fields" | sed -n 1p)
          assignee=$(printf '%s\n' "$fields" | sed -n 2p)
          title=$(printf '%s\n' "$fields" | sed -n 3p)
          writer=$(printf '%s\n' "$fields" | sed -n 4p)
          gh issue view "$ISSUE" --json body --jq .body > "$RUNNER_TEMP/issue.md"
          printf '%s' "$VARIABLES" > "$RUNNER_TEMP/variables.json"
          args=(--stage issue --issue-file "$RUNNER_TEMP/issue.md" --variables "$RUNNER_TEMP/variables.json" --config relevo.yml)
          [ -n "$base" ] && args+=(--base "$base")
          [ -n "$RELEVO_REFERENCES" ] && args+=(--manifest "$RELEVO_REFERENCES")
          code=0
          result=$(node "$script" "${args[@]}") || code=$?
          if [ "$code" -gt 1 ]; then
            echo "::warning::The check before the agent could not run (exit $code); the agent will check the issue itself"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            # The notes of the check (a scenario that the issue also excludes, a rules file that could not be read) go to the same line of the hand-off, on one line each.
            unverified=$(printf '%s' "$result" | node -e 'const r = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log([...r.unverified.map((u) => u.name + " (" + u.purpose + ")"), ...(r.notes ?? []).map((n) => "check: " + String(n).replace(/\s+/g, " "))].join("; "))')
            [ -z "$unverified" ] || echo "RELEVO_INPUTS_TO_CONFIRM=$unverified" >> "$GITHUB_ENV"
            exit 0
          fi
          reason=$(printf '%s' "$result" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).reason)')
          missing=$(printf '%s' "$result" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).missing)')
          to="${writer:-${assignee:-$GITHUB_ACTOR}}"
          body=$(WRITER="$to" TITLE="$title" MISSING="$missing" REASON="$reason" node -e 'const e = process.env; console.log(JSON.stringify({spec_writer: e.WRITER, issue: Number(process.env.ISSUE), title: e.TITLE, missing: e.MISSING, reason: e.REASON}))' \
            | node "$RUNNER_TEMP/relevo/scripts/render-message.mjs" needs_spec --config relevo.yml)
          gh issue edit "$ISSUE" --remove-label relevo:ready --remove-label relevo:queued --remove-label relevo:building --add-label relevo:needs-spec
          [ -z "$writer" ] || gh issue edit "$ISSUE" --add-assignee "$writer" || true
          gh issue comment "$ISSUE" --body "$body"
          echo "::error::The issue went back to needs-spec ($reason) before the agent started: $missing"
          exit 1

      # relevo:agent-step begin
      - id: agent
        uses: anthropics/claude-code-action@v1
        env:
          OPENSPEC_TELEMETRY: '0'
          GH_TOKEN: ${{ github.token }}
          # Without this the agent may start a subagent in the background and end the run before it finishes,
          # leaving the issue stuck on building with no comment (seen in the pilot, see docs/pilot-findings.md).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          # Credentials: choose ONE of the next two lines.
          # a) API key (default):
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # b) Subscription: create a token with `claude setup-token` and store it as the secret CLAUDE_CODE_OAUTH_TOKEN.
          #    The command prints the token over two lines; remove all whitespace before storing it, for example
          #    `pbpaste | tr -d '[:space:]' | gh secret set CLAUDE_CODE_OAUTH_TOKEN`. Then replace the line above with:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The action downloads Bun again on every run unless it is given one: this is the pinned and cached one that the step
          # "Check the version of Bun" verified.
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          # The queue starts builds with `gh workflow run`, so the actor is the Actions bot and the action refuses
          # it unless it is allowed. Only this one bot: never '*', which would let outside apps start runs.
          allowed_bots: github-actions
          # The plugin is not installed from a marketplace: --plugin-dir in claude_args loads the package that the step
          # "Check the toolchain" unpacked at RELEVO_VERSION, so one pin decides the scripts and the skills, nothing is
          # cloned and no token is needed to read the plugin repository.
          # The issue text is data, never instructions: the skill tells the agent so. The tool list is closed:
          # only the tools in --allowedTools, and no web access (nothing to fetch, nowhere to send a secret).
          # Do not set allowed_non_write_users or show_full_output here, and never widen allowed_bots: they open the run to
          # strangers or print tool results (possibly secrets) to the log.
          # The decision the `decide` job already made travels with the prompt, encoded so that the issue title in it
          # is never read as an instruction. The skill decodes it and skips its own planning step.
          prompt: /relevo:go ${{ github.event.issue.number || inputs.issue }} --decision ${{ needs.decide.outputs.decision_b64 }}
          # relevo:restricted begin
          # Files that no agent reads (docs/security.md): Read denials for the file tools, and the sandbox read denials, which apply
          # only where a person enables the sandbox: it is NOT enabled here. Written from the base list and `restricted_paths` of
          # relevo.yml by /relevo:init, so do not edit this block by hand.
          # The action merges this input into the user-level settings of the runner, outside the repository, one top-level key
          # at a time: that is why it carries the whole `permissions` and `sandbox` objects.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(**/.env)",
                  "Read(**/.env.*.local)",
                  "Read(**/.env.local)",
                  "Read(**/.env.development)",
                  "Read(**/.env.production)",
                  "Read(**/.env.staging)",
                  "Read(**/.env.test)",
                  "Read(**/.env.testing)",
                  "Read(**/.env.dev)",
                  "Read(**/.env.prod)",
                  "Read(**/.env.qa)",
                  "Read(**/.env.ci)",
                  "Read(**/.env.preview)",
                  "Read(**/*.pem)",
                  "Read(**/*.key)",
                  "Read(**/*.p12)",
                  "Read(**/*.pfx)",
                  "Read(**/*.p8)",
                  "Read(**/*.ppk)",
                  "Read(**/*.keystore)",
                  "Read(**/*.jks)",
                  "Read(**/id_rsa)",
                  "Read(**/id_dsa)",
                  "Read(**/id_ecdsa)",
                  "Read(**/id_ed25519)",
                  "Read(**/.npmrc)",
                  "Read(**/.netrc)",
                  "Read(**/.pypirc)",
                  "Read(**/.git-credentials)",
                  "Read(**/.pgpass)",
                  "Read(**/.htpasswd)",
                  "Read(**/google-services.json)",
                  "Read(**/GoogleService-Info.plist)",
                  "Read(**/key.properties)",
                  "Read(/${{ github.workspace }}/secrets/**)"
                ]
              },
              "sandbox": {
                "filesystem": {
                  "denyRead": [
                    "**/.env",
                    "**/.env.*.local",
                    "**/.env.local",
                    "**/.env.development",
                    "**/.env.production",
                    "**/.env.staging",
                    "**/.env.test",
                    "**/.env.testing",
                    "**/.env.dev",
                    "**/.env.prod",
                    "**/.env.qa",
                    "**/.env.ci",
                    "**/.env.preview",
                    "**/*.pem",
                    "**/*.key",
                    "**/*.p12",
                    "**/*.pfx",
                    "**/*.p8",
                    "**/*.ppk",
                    "**/*.keystore",
                    "**/*.jks",
                    "**/id_rsa",
                    "**/id_dsa",
                    "**/id_ecdsa",
                    "**/id_ed25519",
                    "**/.npmrc",
                    "**/.netrc",
                    "**/.pypirc",
                    "**/.git-credentials",
                    "**/.pgpass",
                    "**/.htpasswd",
                    "**/google-services.json",
                    "**/GoogleService-Info.plist",
                    "**/key.properties",
                    "/${{ github.workspace }}/secrets"
                  ]
                }
              }
            }
          # relevo:restricted end
          claude_args: >-
            --max-turns 100
            --max-budget-usd 5
            --plugin-dir ${{ runner.temp }}/relevo
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Task"
            --disallowedTools "WebFetch,WebSearch,Bash(curl:*),Bash(wget:*)"
      # relevo:agent-step end

      # The scripts of the next two steps come from the plugin package. It is unpacked into the workspace only now, after the agent has
      # finished, because the agent's preflight needs a clean working tree and a checkout inside it would not be.
      - name: Install the Relevo scripts for the reports
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .relevo-plugin
          npm pack "@elalfner/relevo@$RELEVO_VERSION" --silent --pack-destination "$RUNNER_TEMP" > /dev/null
          tar -xzf "$RUNNER_TEMP"/elalfner-relevo-*.tgz --strip-components=1 -C .relevo-plugin
          for f in scripts/run-usage.mjs scripts/usage-limit.mjs scripts/limit-retry.mjs scripts/run-cut.mjs scripts/rescue-work.mjs scripts/progress.mjs scripts/tree-baseline.mjs scripts/render-message.mjs; do
            [ -f ".relevo-plugin/$f" ] || { echo "::error::The Relevo package $RELEVO_VERSION lacks $f"; exit 1; }
          done

      # The failure path of the go skill is run by the agent, so a run that the runner cuts (turn or cost limit) or that
      # is cancelled or times out never runs it, and the work is only in this working tree. If the issue is still ready
      # or building after the agent step, no outcome was recorded: commit what is here and push it to the branch of the
      # issue, through the same scans as every commit of Relevo (protected paths, restricted files, markers and
      # credentials). Nothing is pushed after a refusal, nothing is forced, and nothing on the remote is overwritten:
      # only a fast-forward is pushed, and a remote branch with commits this run does not have is left alone. The step records the class for the usage record (`limit` when the runner cut the agent or the agent step did not succeed, `other` when the agent ended by itself with no result) and never fails the job.
      # If you renamed the labels in relevo.yml, change the names below too.
      - name: Keep the work of a run that was cut
        id: rescue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          DECISION: ${{ needs.decide.outputs.decision_b64 }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          labels=$(gh issue view "$ISSUE" --json labels --jq '.labels[].name')
          printf '%s\n' "$labels" | grep -qxE 'relevo:(ready|building)' || exit 0
          # `limit` is for a run that was cut: by the runner (its turn or cost limit, read from the log) or by the job
          # (the agent step failed, was cancelled or timed out). An agent that ended by itself with no result, which the
          # report step also treats as a run with no outcome, is `other`.
          class=other
          cut=""
          [ -n "$EXECUTION_FILE" ] && [ -f .relevo-plugin/scripts/run-cut.mjs ] && cut=$(node .relevo-plugin/scripts/run-cut.mjs --file "$EXECUTION_FILE")
          { [ -n "$cut" ] || [ "$AGENT_OUTCOME" != "success" ]; } && class=limit
          [ -n "$RELEVO_PROGRESS_DIR" ] && node .relevo-plugin/scripts/progress.mjs class "$class"
          [ -f .relevo-plugin/scripts/rescue-work.mjs ] || exit 0
          flag=""; [ -f relevo.yml ] && flag="--config relevo.yml"
          node .relevo-plugin/scripts/rescue-work.mjs --decision "$DECISION" --github-output "$GITHUB_OUTPUT" $flag
          exit 0

      # What the run used, read from the agent's execution log. The format of that log is not documented, so the
      # reader is tolerant: when it finds nothing it posts nothing, and this step can never fail the job.
      - name: Report what the run used
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          # With a subscription token and no API key the cost is notional.
          ONLY_SUBSCRIPTION: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          [ -n "$EXECUTION_FILE" ] || exit 0
          flag=""; [ "$ONLY_SUBSCRIPTION" = "true" ] && flag="--subscription"
          [ -n "$RELEVO_PROGRESS_DIR" ] && flag="$flag --progress-dir $RELEVO_PROGRESS_DIR"
          [ -f relevo.yml ] && flag="$flag --config relevo.yml"
          line=$(node .relevo-plugin/scripts/run-usage.mjs --file "$EXECUTION_FILE" $flag)
          [ -n "$line" ] && gh issue comment "$ISSUE" --body "$line"
          exit 0

      # A run can end without telling anyone: the plugin cannot be cloned, the login fails, preflight stops, the
      # run reached --max-turns or --max-budget-usd (the runner cuts it; the agent cannot see those counters and
      # does not stop itself), or the agent ends its session early (all seen in the pilot, see docs/pilot-findings.md). If the issue is still
      # ready or building after the agent step, no outcome was recorded, so say so on the issue.
      # If you renamed the labels in relevo.yml, change the names below too.
      - name: Report a run that ended without an outcome
        id: no_outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          RESCUE_STATE: ${{ steps.rescue.outputs.state }}
          RESCUE_BRANCH: ${{ steps.rescue.outputs.branch }}
          RESCUE_DETAIL: ${{ steps.rescue.outputs.detail }}
          RESCUE_CHECKPOINTS: ${{ steps.rescue.outputs.checkpoints }}
        run: |
          labels=$(gh issue view "$ISSUE" --json labels --jq '.labels[].name')
          # A run the queue dispatched that fails before it claims the issue leaves it `queued`: report that
          # too, or the queue would dispatch it again every 30 minutes. A run that ends normally leaves it queued
          # on purpose (no capacity), so that case is only reported when the job failed.
          if ! printf '%s\n' "$labels" | grep -qxE 'relevo:(ready|building)'; then
            if ! { [ "$JOB_STATUS" != "success" ] && printf '%s\n' "$labels" | grep -qx 'relevo:queued'; }; then
              exit 0
            fi
          fi
          assignee=$(gh issue view "$ISSUE" --json assignees --jq '.assignees[0].login // empty')
          limit_reached=false
          [ -n "$EXECUTION_FILE" ] && node .relevo-plugin/scripts/usage-limit.mjs --file "$EXECUTION_FILE" > /dev/null && limit_reached=true
          # Which limit of the runner cut the run, when its log says (the script prints nothing otherwise).
          cut=""
          [ -n "$EXECUTION_FILE" ] && cut=$(node .relevo-plugin/scripts/run-cut.mjs --file "$EXECUTION_FILE")
          # The words come from the message catalog, in the language of relevo.yml, so that language: es is honoured. The
          # package that the toolchain check unpacked has the script; the one installed for the reports is the second choice.
          render=""
          for candidate in "$RUNNER_TEMP/relevo/scripts/render-message.mjs" .relevo-plugin/scripts/render-message.mjs; do
            if [ -f "$candidate" ]; then render="$candidate"; break; fi
          done
          # A usage limit is not a failure of the code: the issue goes back to the queue with a retry time and one comment says when,
          # instead of `qa-failed`. It is bounded (3 retries), it never retries when the work done was not kept (the rescue step says),
          # and it needs the comment of the catalog (the hidden retry time is in it): without that comment the path below runs.
          retry_body=""
          limit_stop=""
          if [ "$limit_reached" = "true" ] && [ -n "$render" ] && [ -f .relevo-plugin/scripts/limit-retry.mjs ]; then
            decision=$(node .relevo-plugin/scripts/limit-retry.mjs --file "$EXECUTION_FILE" --rescue-state "$RESCUE_STATE" --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" 2>/dev/null) || decision=""
            action=$(printf '%s' "$decision" | jq -r '.action // empty' 2>/dev/null) || action=""
            if [ "$action" = "retry" ]; then
              retry_body=$(ASSIGNEE="$assignee" RETRY_JSON="$decision" node -e 'const e = process.env, d = JSON.parse(e.RETRY_JSON); console.log(JSON.stringify({issue: e.ISSUE, run: e.RUN_URL, assignee: e.ASSIGNEE, at: d.at, reason: d.reason, attempt: d.attempt, max: d.max, rescue_state: e.RESCUE_STATE, rescue_branch: e.RESCUE_BRANCH}))' \
                | node "$render" usage_limit_retry --config relevo.yml) || retry_body=""
            else
              limit_stop=$(printf '%s' "$decision" | jq -r '.reason // empty' 2>/dev/null) || limit_stop=""
            fi
          fi
          if [ -n "$retry_body" ]; then
            # `queued` is only added here: a label that one command both adds and removes is gone afterwards, and the issue would be in no queue.
            gh issue edit "$ISSUE" --remove-label relevo:ready --remove-label relevo:building --add-label relevo:queued
            gh issue comment "$ISSUE" --body "$retry_body"
            echo "reported=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue edit "$ISSUE" --remove-label relevo:ready --remove-label relevo:queued --remove-label relevo:building --add-label relevo:qa-failed
          # What happened decides the text: the rescue step kept the work, or the model account reached its usage limit (a
          # quota or an empty credit balance is not a failure of the code; after the retries were used up it says so), or the run
          # simply ended without a result.
          situation=no_result
          if [ "$limit_stop" = "bound" ]; then
            situation=usage_limit_stopped
          elif [ "$RESCUE_STATE" = "kept" ]; then
            situation=kept
          elif [ "$limit_reached" = "true" ]; then
            situation=usage_limit
          fi
          body=""
          if [ -n "$render" ]; then
            body=$(ASSIGNEE="$assignee" SITUATION="$situation" CUT="$cut" LIMIT_REACHED="$limit_reached" node -e 'const e = process.env; console.log(JSON.stringify({situation: e.SITUATION, issue: e.ISSUE, run: e.RUN_URL, job_status: e.JOB_STATUS, assignee: e.ASSIGNEE, cut: e.CUT, usage_limit: e.LIMIT_REACHED === "true", max: 3, rescue_state: e.RESCUE_STATE, rescue_branch: e.RESCUE_BRANCH, rescue_detail: e.RESCUE_DETAIL, checkpoints: /^[0-9]+$/.test(e.RESCUE_CHECKPOINTS ?? "") ? Number(e.RESCUE_CHECKPOINTS) : undefined}))' \
              | node "$render" run_no_outcome --config relevo.yml) || body=""
          fi
          # The one text that stays here: when the scripts cannot render the comment (a package without the script, a failure of node)
          # the issue still has to be told, in English.
          if [ -z "$body" ]; then
            kept=""
            [ "$RESCUE_STATE" = "kept" ] && kept=" The work done before the stop was kept on the branch \`$RESCUE_BRANCH\`."
            body="${assignee:+@$assignee }The run ended without an outcome (job status: $JOB_STATUS), so nothing was built or reported.$kept Read the log to see why: $RUN_URL. When the cause is fixed, remove \`relevo:qa-failed\` and apply \`relevo:ready\` again."
          fi
          gh issue comment "$ISSUE" --body "$body"
          echo "reported=true" >> "$GITHUB_OUTPUT"

      # The progress report ends here, after every report above so that its last line is true: first the check is asked to
      # stop and waited for (so that it cannot write over the closing), then the comment is replaced by one line. Neither
      # step can fail the job, and neither does anything when the report never started.
      - name: Stop the progress report
        if: always()
        continue-on-error: true
        run: |
          script="$RUNNER_TEMP/relevo/scripts/progress.mjs"
          [ -f "$script" ] && [ -n "$RELEVO_PROGRESS_DIR" ] || exit 0
          node "$script" stop --wait 20
          exit 0

      - name: Close the progress comment
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NO_OUTCOME: ${{ steps.no_outcome.outputs.reported }}
        run: |
          script="$RUNNER_TEMP/relevo/scripts/progress.mjs"
          [ -f "$script" ] && [ -n "$RELEVO_PROGRESS_DIR" ] || exit 0
          outcome=result
          [ "$NO_OUTCOME" = "true" ] && outcome=none
          node "$script" close --issue "$ISSUE" --outcome "$outcome" --run-url "$RUN_URL"
          exit 0

      # A runner may keep its workspace between jobs (a self-hosted one does): remove what this job added to it.
      - name: Remove what this job added
        if: always()
        run: rm -rf .relevo-plugin

  # Starts the queue (relevo-queue.yml) when a build ends or the light job fails after it claimed the issue: the labels
  # that the run sets use the workflow token, and an event made with that token starts no workflow, so the queue would
  # not hear that a slot was freed until its schedule runs. It is a job of its own so that `actions: write` is never held
  # by the job that runs the agent: the issue text is untrusted and the agent has Bash and this token. It runs no agent
  # and no project code, and needs no checkout. A decision that builds nothing (needs-spec, blocked, queued, denied...)
  # frees no slot, so it starts nothing. It never fails the run: without a queue workflow the schedule is the only path.
  requeue:
    needs: [decide, build]
    if: always() && vars.RELEVO_CLOUD_GO != 'off' && (needs.build.result != 'skipped' || needs.decide.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the queue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh workflow run relevo-queue.yml --repo "$GITHUB_REPOSITORY"; then
            echo "::warning::The queue was not started (is relevo-queue.yml installed?). Waiting issues start at its next scheduled run."
          fi
