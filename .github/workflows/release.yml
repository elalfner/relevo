# Publishes the npm package @elalfner/relevo when a tag vX.Y.Z is pushed. The order of a release is: publish (this
# workflow, from the tag), then promote dev to main, so the templates on main never pin a package that is not
# published. It publishes with the identity of this run (npm Trusted Publishing): no token is stored anywhere, and the
# package settings on npmjs.com must trust this repository and this file name, release.yml (see RELEASING.md).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships an npm that supports Trusted Publishing; registry-url points npm publish at the registry.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: The tag is the version of the package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in package.json; nothing was published"
            exit 1
          fi

      - name: Tests
        run: npm test

      # A failed publish is read against these versions: an npm that does not support Trusted Publishing fails there.
      - name: Versions of Node and npm
        run: |
          node --version
          npm --version

      # No NODE_AUTH_TOKEN: the CLI uses the identity of the run. A login that npm refuses fails here with npm's own
      # message, which names the likely cause (the trusted publisher on npmjs.com does not match).
      - name: Publish
        run: npm publish --provenance --access public
