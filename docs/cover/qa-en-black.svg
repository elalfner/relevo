<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" width="640" height="486" role="img" aria-label="An agent builds, your checks run, and a team of agents that did not write the code examines the work: Spec, Security, Code, Bugs and Interface. What blocks is fixed and reviewed again; then you receive it." font-family="Nunito, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#000000">
<rect x="30" y="4" width="250" height="46" rx="10" fill="none" stroke="#000000" stroke-width="2"></rect>
<text x="155" y="33" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">An agent builds</text>
<rect x="360" y="4" width="250" height="46" rx="10" fill="none" stroke="#000000" stroke-width="2"></rect>
<text x="485" y="33" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">Your project's checks</text>
<path d="M290 27h58 M340 20l9 7-9 7" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"></path>
<path d="M485 54v36 M478 82l7 9 7-9" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"></path>
<path d="M155 92V56 M148 64l7-9 7 9" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
<text x="168" y="77" font-size="13" font-weight="600" fill="#000000" text-anchor="start">what blocks is fixed</text>
<rect x="4" y="94" width="632" height="308" rx="10" fill="none" stroke="#000000" stroke-width="2"></rect>
<text x="320" y="122" font-size="15" font-weight="800" fill="#000000" text-anchor="middle">A team of agents that did not write the code</text>
<rect x="20" y="136" width="196" height="122" rx="10" fill="none" stroke="#000000" stroke-width="2"><animate attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.1;0.2;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
<g data-lens="spec" transform="translate(102,145)" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h13l6 6v20H7z M20 3v6h6"/><path d="M11 19l4 4 7-8"/></g>
<text x="118" y="196" font-size="17" font-weight="800" fill="#000000" text-anchor="middle">Spec</text>
<text x="118" y="215" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">scenarios with no</text>
<text x="118" y="231" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">code or test, tasks</text>
<text x="118" y="247" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">taken for done</text>
<rect x="222" y="136" width="196" height="122" rx="10" fill="none" stroke="#000000" stroke-width="2"><animate attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.1;0.2;1" dur="6s" begin="1s" repeatCount="indefinite"/></rect>
<g data-lens="security" transform="translate(304,145)" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 4v8c0 7-5 12-11 14C10 27 5 22 5 15V7z"/><path d="M11 16l4 4 7-8"/></g>
<text x="320" y="196" font-size="17" font-weight="800" fill="#000000" text-anchor="middle">Security</text>
<text x="320" y="215" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">injection, permission</text>
<text x="320" y="231" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">flaws, exposed</text>
<text x="320" y="247" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">secrets</text>
<rect x="424" y="136" width="196" height="122" rx="10" fill="none" stroke="#000000" stroke-width="2"><animate attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.1;0.2;1" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
<g data-lens="code" transform="translate(506,145)" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 8l-8 8 8 8 M21 8l8 8-8 8 M19 5l-6 22"/></g>
<text x="522" y="196" font-size="17" font-weight="800" fill="#000000" text-anchor="middle">Code</text>
<text x="522" y="215" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">weak tests, leftovers,</text>
<text x="522" y="231" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">bad practices of</text>
<text x="522" y="247" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">your stack</text>
<rect x="121" y="268" width="196" height="122" rx="10" fill="none" stroke="#000000" stroke-width="2"><animate attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.1;0.2;1" dur="6s" begin="3s" repeatCount="indefinite"/></rect>
<g data-lens="bugs" transform="translate(203,277)" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="19" rx="7" ry="9"/><path d="M12 11a4 4 0 018 0 M9 15L3 12 M9 20H2 M10 25l-6 4 M23 15l6-3 M23 20h7 M22 25l6 4 M16 14v14"/></g>
<text x="219" y="328" font-size="17" font-weight="800" fill="#000000" text-anchor="middle">Bugs</text>
<text x="219" y="347" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">wrong conditions,</text>
<text x="219" y="363" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">functions that break</text>
<text x="219" y="379" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">their callers</text>
<rect x="323" y="268" width="196" height="122" rx="10" fill="none" stroke="#000000" stroke-width="2"><animate attributeName="stroke-width" values="2;5;2;2" keyTimes="0;0.1;0.2;1" dur="6s" begin="4s" repeatCount="indefinite"/></rect>
<g data-lens="interface" transform="translate(405,277)" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="26" height="20" rx="2"/><path d="M3 11h26 M11 29h10 M16 25v4"/></g>
<text x="421" y="328" font-size="17" font-weight="800" fill="#000000" text-anchor="middle">Interface</text>
<text x="421" y="347" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">what breaks your</text>
<text x="421" y="363" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">design rules</text>
<path d="M320 406v28 M313 426l7 9 7-9" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"></path>
<rect x="150" y="438" width="340" height="46" rx="10" fill="#000000" stroke="#000000" stroke-width="2"></rect>
<text x="320" y="467" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">You receive reviewed work</text>
</svg>
